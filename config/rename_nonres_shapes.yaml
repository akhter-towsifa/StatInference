# Config for StatInference/dc_make/rename_shapes.py, applied to the merged
# HistMergerTask output for a single (era, DNN-score variable) before it is fed
# to create_datacards.py.
#
# PROVISIONAL: rename_shapes.py only reads one directory level from the input
# file (top-level TDirectory -> histograms directly inside, no recursion), so
# the merged shape file it consumes is assumed to have one flat top-level
# directory per (channel, QCD region, category) -- e.g. "eTau_OS_Iso_res1b" --
# built from createKeyFilterDict's (channel, region, category) key tuple
# (Analysis/hh_bbtautau.py). This has NOT yet been confirmed against a real
# produced file. Before the first real run: open the HistMergerTask output with
# `python3 -c "import ROOT; f=ROOT.TFile('<file>'); f.ls()"`, check the actual
# top-level directory names, and adjust dir_accept_filters/dir_rename_rules
# below to match if they differ from what's assumed here.
#
# Effect: keep only the OS_Iso (signal region) directories for the res1b/res2b/
# boosted categories and eTau/muTau/tauTau channels, and rename
# "<channel>_OS_Iso_<category>" -> "<channel>/<category>" (nested TDirectory,
# via ROOT's TDirectory::mkdir("a/b") support) -- the hist_name convention
# StatInference/dc_make/maker.py expects ({channel}/{category}/{process}).
# All other QCD regions (SS_Iso, OS_AntiIso, SS_AntiIso) are dropped since they
# only existed to feed the ABCD QCD estimate upstream.

dir_accept_filters:
  - ^(eTau|muTau|tauTau)_OS_Iso_(res1b|res2b|boosted)$

dir_rename_rules:
  - ["^(eTau|muTau|tauTau)_OS_Iso_(res1b|res2b|boosted)$", "\\1/\\2"]

# Histogram (process) names are expected to already match what the datacard
# config's `process`/`hist_name` fields expect -- no renaming needed unless
# verification turns up a mismatch.

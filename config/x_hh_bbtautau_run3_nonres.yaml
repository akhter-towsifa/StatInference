analysis: hh_bbtautau
type: nonresonant
model:
  parameters: [ ]
  param_dependent_bkg: false
  input_file_pattern: ${ERA}.root
eras:
  - Run3_2022EE
channels:
  - eTau
  - muTau
  - tauTau
categories:
  - res1b
  - res2b
  - boosted
signalFractionForRelevantBins: 0.2
keep_all_signal_hypothesis_into_single_datacard: true
processes:
  - process: data_obs
    is_data: true
    is_asimov_data: true

  # ggF: dhi.models.hh_model_run23:model_default_run3_nonres recognizes all 4
  # of our points (kl=0,1,2.45,5 @ kt=1) -- renamed to the model's
  # "13p6TeV"-tagged labels below (hist_name keeps pointing at our real shape
  # histogram). See inference/dhi/models/hh_model_run23.py, the
  # model_default_run3_nonres definition, for why this model was added.
  - process: ggHH_kl_0_kt_1_13p6TeV_hbbhtt
    hist_name: GluGluToHHto2B2Tau_0p00_1p00_0p00
    is_signal: true
  - process: ggHH_kl_1_kt_1_13p6TeV_hbbhtt
    hist_name: GluGluToHHto2B2Tau_1p00_1p00_0p00
    is_signal: true
  - process: ggHH_kl_2p45_kt_1_13p6TeV_hbbhtt
    hist_name: GluGluToHHto2B2Tau_2p45_1p00_0p00
    is_signal: true
  - process: ggHH_kl_5_kt_1_13p6TeV_hbbhtt
    hist_name: GluGluToHHto2B2Tau_5p00_1p00_0p00
    is_signal: true

  # VBF: model_default_run3_nonres uses the boosted_vbf_points basis (chosen
  # over default_vbf_points because it excludes the CV~-0.012 benchmark,
  # which made the 6x6 coupling matrix nearly singular and its derived scale
  # factor explode to O(300-450) away from kl=1 -- see conversation history /
  # the model's own docstring comment). That basis recognizes 6 of our 10 EFT
  # benchmark points, renamed to the model's "13p6TeV"-tagged labels below.
  # The 4 unmatched points (2p12_3p87_m5p96, m0p012_0p030_10p2,
  # m1p21_1p94_m0p94, m1p83_3p57_m3p39) keep our own hist names and ride
  # along as unscaled "additional signals" (dropped by default at
  # create_datacards.py time; only kept with
  # --CombineDatacards-keep-additional-signals all on `law run UpperLimits`,
  # which we've found breaks text2workspace.py's getYieldScale -- so in
  # practice these 4 are excluded from UpperLimits/PlotLikelihoodScan runs).
  - process: qqHH_CV_1_C2V_0_kl_1_13p6TeV_hbbhtt
    hist_name: VBFHHto2B2Tau_1_0_1
    is_signal: true
  - process: qqHH_CV_1_C2V_1_kl_1_13p6TeV_hbbhtt
    hist_name: VBFHHto2B2Tau_1_1_1
    is_signal: true
  - process: qqHH_CV_1p74_C2V_1p37_kl_14p4_13p6TeV_hbbhtt
    hist_name: VBFHHto2B2Tau_1p74_1p37_14p4
    is_signal: true
  - process: VBFHHto2B2Tau_2p12_3p87_m5p96
    is_signal: true
  - process: VBFHHto2B2Tau_m0p012_0p030_10p2
    is_signal: true
  - process: qqHH_CV_m0p758_C2V_1p44_kl_m19p3_13p6TeV_hbbhtt
    hist_name: VBFHHto2B2Tau_m0p758_1p44_m19p3
    is_signal: true
  - process: qqHH_CV_m0p962_C2V_0p959_kl_m1p43_13p6TeV_hbbhtt
    hist_name: VBFHHto2B2Tau_m0p962_0p959_m1p43
    is_signal: true
  - process: VBFHHto2B2Tau_m1p21_1p94_m0p94
    is_signal: true
  - process: qqHH_CV_m1p6_C2V_2p72_kl_m1p36_13p6TeV_hbbhtt
    hist_name: VBFHHto2B2Tau_m1p60_2p72_m1p36
    is_signal: true
  - process: VBFHHto2B2Tau_m1p83_3p57_m3p39
    is_signal: true

  # Backgrounds
  - process: TT
  - process: DY
  - process: ST
    allow_zero_integral: True
    allow_negative_bins_within_error: True
    max_n_sigma_for_negative_bins: 1.2
  - process: VV
    allow_zero_integral: True
    allow_negative_bins_within_error: True
  - process: VVV
    allow_zero_integral: True
    allow_negative_bins_within_error: True
    max_n_sigma_for_negative_bins: 1.01
  - process: ttH
    allow_zero_integral: True
    allow_negative_bins_within_error: True
  # WtoLNu dropped for now: not a major background, and its negative bins in
  # the equal-yield-binned tail hit the unconditional relevant-bin veto
  # (StatInference/common/tools.py:resolveNegativeBins) that no tolerance
  # flag can resolve -- see StatInference/dc_make/diagnose_negative_bins.py.
  - process: VBFH
    allow_zero_integral: True
    allow_negative_bins_within_error: True
  - process: ggH
    allow_zero_integral: True
    allow_negative_bins_within_error: True
  - process: VH
    allow_zero_integral: True
    allow_negative_bins_within_error: True
  - process: QCD
    allow_zero_integral: True
    allow_negative_integral: True
    allow_negative_bins_within_error: True
    max_n_sigma_for_negative_bins: 10

uncertainties:
  # https://twiki.cern.ch/twiki/bin/viewauth/CMS/LumiRecommendationsRun3?extralog=-%20caching%20topic#Correlations_between_years_and_c
  - name: lumi_1
    type: lnN
    eras:
      - Run3_2022
      - Run3_2022EE
    value: 0.0138
  - name: lumi_2
    type: lnN
    eras:
      - Run3_2023
    value: 0.0127
  - name: lumi_3
    type: lnN
    eras:
      - Run3_2024
    value: 0.0144

  # Process-level QCD scale (renormalization/factorization) uncertainties.
  # Independent per process (each a separate perturbative-QCD calculation),
  # mirroring HH_bbWW/config/Datacards/x_hh_bbww_DL_run3.yaml's pattern.
  # Values from FLAF/config/crossSections13p6TeV.yaml ([down, up], converted
  # to relative fractions); TT/DY match bbWW's own numbers exactly (same
  # source file). VV/VVV have no trustworthy scale+PDF value in our
  # crossSections file (every VV/VVV sub-dataset's `unc:` there is an XSDB
  # generator-statistics number, ~0.03-0.06%, two orders of magnitude too
  # small to use) -- VV borrows the Run2 reference config's real WZ value
  # (largest of its WW/WZ/ZZ), VVV uses a conservative flat placeholder;
  # both should be replaced with real values if/when found.
  - name: QCD_scale_TT
    type: lnN
    processes:
      - TT
    value: [-0.036, 0.025]
    # TT: scale +22.6/-33.4 on 923.6 pb (TtbarNNLO reference)
  - name: QCD_scale_DY
    type: lnN
    processes:
      - DY
    value: [-0.011, 0.007]
    # DY_NNLO_QCD_NLO_EW: +0.7%/-1.1% (MATRIX NNLO QCD + NLO EW)
  - name: QCD_scale_ST
    type: lnN
    processes:
      - ST
    value: [-0.019, 0.020]
    # tW channel (largest-uncertainty single-top sub-channel): +2.0%/-1.9%
  - name: QCD_scale_VV
    type: lnN
    processes:
      - VV
    value: [-0.033, 0.041]
    # placeholder: borrowed from the Run2 reference config's WZ QCD_scale_process
    # value (largest of WW/WZ/ZZ there) -- no trustworthy VV scale value found
    # in our own crossSections13p6TeV.yaml (only XSDB stat-precision numbers)
  - name: QCD_scale_VVV
    type: lnN
    processes:
      - VVV
    value: 0.15
    # placeholder: no theory scale value found for any VVV sub-dataset in
    # crossSections13p6TeV.yaml (only XSDB stat-precision numbers); flat 15%
    # is a conservative stand-in for an uncalculated low-rate triboson process
  - name: QCD_scale_ttH
    type: lnN
    processes:
      - ttH
    value: [-0.093, 0.06]
    # TTHto2B_M125: +6%/-9.3% (QCD Scale)
  - name: QCD_scale_VBFH
    type: lnN
    processes:
      - VBFH
    value: [-0.003, 0.005]
    # VBFHToBB_M125: +0.5%/-0.3% (QCD Scale)
  - name: QCD_scale_ggH
    type: lnN
    processes:
      - ggH
    value: [-0.067, 0.046]
    # GluGluHToTauTau_M125/GluGluHToBB_M125: +4.6%/-6.7% (theory)
  - name: QCD_scale_VH
    type: lnN
    processes:
      - VH
    value: [-0.007, 0.004]
    # WplusH_Hbb_*/WminusH_Hbb_*: +0.4%/-0.7% (QCD scale)

  # PDF+alphas_s: one shared, correlated nuisance (same PDF set affects every
  # process coherently, only the magnitude differs) -- also mirrors
  # x_hh_bbww_DL_run3.yaml's PDF_alphas pattern exactly.
  - name: PDF_alphas
    type: lnN
    hasMultipleValues: True
    value:
      - value: 0.025
        processes: [TT]
        # TT: +-22.8/923.6 pb (TtbarNNLO reference)
      - value: 0.01
        processes: [DY]
        # borrowed from bbWW's DY PDF+alphas value (same MATRIX twiki
        # reference); our own crossSections.yaml entry doesn't separately
        # list a PDF+alphas component for DY
      - value: 0.024
        processes: [ST]
        # tW channel: +-2.4 (PDF AlphaS)
      - value: 0.035
        processes: [ttH]
        # TTHto2B_M125: +-3.5% (PDF alpha s)
      - value: 0.021
        processes: [VBFH]
        # VBFHToBB_M125: +-2.1% (PDF alpha s)
      - value: 0.032
        processes: [ggH]
        # GluGluHToTauTau_M125/GluGluHToBB_M125: +-3.2 (PDF+alpha s)
      - value: 0.018
        processes: [VH]
        # WplusH_Hbb_*/WminusH_Hbb_*: +-1.8% (PDF+alphas)

autolnNThr: 0.1
asymlnNThr: 0.001
ignorelnNThr: 0.001
autoMCStats:
  apply: true
  threshold: 20
  apply_to_signal: true
  mode: 1

# Command used to produce the datacards from this config (latest version:
# process names matched to dhi.models.hh_model_run23:model_default_run3_nonres,
# see that model's definition/docstring in
# inference/dhi/models/hh_model_run23.py for why it was added). Since we want
# to set an HH signal-strength limit, we use the signal class's DNN score as
# the shape discriminant.
#
# 1) region-select + flatten the merged shapes to full resolution (once per
#    DNN variant -- ggF_DNN_pytorch_full_HH / ggF_DNN_pytorch_combined_kinFit_HH):
# python3 StatInference/dc_make/select_region_shapes.py \
#   --input  <path to Hists_merged>/Run3_2022EE/<variable>/<variable>.root \
#   --output StatInference/output/nonres_run3_2022EE_<dnnFull|dnnKinFit>/Run3_2022EE.root \
#   --region OS_Iso
#
# 2) compute equal-signal-yield quantile binning, once per (DNN variant, ggF
#    kl benchmark point) -- 8 combinations total (kl0/kl1/kl2p45/kl5 x
#    dnnFull/dnnKinFit); --n-bins 30, auto-coarsened where TT/DY hit the
#    unconditional relevant-bin veto (StatInference/common/tools.py:
#    resolveNegativeBins) via StatInference/dc_make/autocoarsen_binning.py:
# python3 StatInference/dc_make/compute_equal_yield_binning.py \
#   --input  StatInference/output/nonres_run3_2022EE_<variant>/Run3_2022EE.root \
#   --output StatInference/output/nonres_run3_2022EE_<variant>/binning_<kl>.json \
#   --signal-process GluGluToHHto2B2Tau_<kl-tag>_1p00_0p00 \
#   --n-bins 30
#
# 3) create the datacards, once per (variant, kl-scheme) -- 8 total, this is
#    the command actually run to produce StatInference/output/
#    nonres_run3_2022EE_<variant>/cards_<kl>_v2/:
# source env.sh
# env -i HOME=$HOME ANALYSIS_PATH=$ANALYSIS_PATH ANALYSIS_DATA_PATH=$ANALYSIS_DATA_PATH \
#   X509_USER_PROXY=$X509_USER_PROXY FLAF_CMSSW_BASE=$FLAF_CMSSW_BASE FLAF_CMSSW_ARCH=$FLAF_CMSSW_ARCH \
#   $FLAF_PATH/cmsEnv.sh python3 StatInference/dc_make/create_datacards.py \
#   --input  StatInference/output/nonres_run3_2022EE_<variant> \
#   --output StatInference/output/nonres_run3_2022EE_<variant>/cards_<kl>_v2 \
#   --config StatInference/config/x_hh_bbtautau_run3_nonres.yaml \
#   --hist-bins StatInference/output/nonres_run3_2022EE_<variant>/binning_<kl>.json
# (the `env -i ... cmsEnv.sh` form is used instead of the `cmsEnv` alias
# because alias expansion is unreliable in non-interactive bash -c calls)
#
# 4) run limits/likelihood scans (kl scan uses --pois kl --scan-parameters
# kl,<min>,<max>,<npoints>, opposite convention from UpperLimits' r-only scan
# with kl frozen -- see conversation history):
# cd $FLAF_CMSSW_BASE/src && source /cvmfs/cms.cern.ch/cmsset_default.sh && eval $(scramv1 runtime -sh) && cd -
# law run UpperLimits --version nonres_2022EE_<variant>_<kl> \
#   --hh-model dhi.models.hh_model_run23:model_default_run3_nonres \
#   --datacards StatInference/output/nonres_run3_2022EE_<variant>/cards_<kl>_v2/datacard_combined_signals.txt \
#   --pois r --scan-parameters kl,1,1,1
# (no --CombineDatacards-keep-additional-signals needed/wanted: the 4
# unmatched VBF points are meant to be dropped, since keeping them breaks
# text2workspace.py's getYieldScale; no @noBRscaling@noHscaling@noNNLOscaling
# needed either -- model_default_run3_nonres's samples are all ecm-tagged, so
# doBRscaling/doHscaling simply find no single-H process to scale given our
# background names carry no decay-mode suffix, and doNNLOscaling is a no-op
# for ecm-tagged samples by construction; CMSSW_BASE must still be exported,
# e.g. via the additive scram-runtime eval above, for text2workspace.py's
# SMHiggsBuilder -- but do NOT wrap the `law run` command itself in that
# eval/PATH change, since it shadows flaf_env's python3 and breaks
# plotlib-dependent tasks like PlotLikelihoodScan; `export CMSSW_BASE=
# $FLAF_CMSSW_BASE` alone, without the full scram eval, is the safe middle
# ground for those)
